<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="440"
     viewBox="0 0 1000 440">

  <rect width="1000" height="440"
        rx="12" fill="#0d1117"/>

  <style>
    text {
      font-family: monospace;
      font-size: 16px;
    }
    .green { fill: #7ee787; }
    .white { fill: #c9d1d9; }
    .muted { fill: #6e7681; }
    .cursor {
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- Left: VG logo -->
  <g class="green"
     font-size="31"
     font-family="monospace"
     font-weight="bold">
    <text x="60" y="185">&lt; V G &gt;</text>
  </g>

  <!-- Right: profile -->
  <text x="400" y="45"
        class="green"
        font-weight="bold">
    vaibhav@github
  </text>

  <path d="M 560 40 H 960"
        stroke="#6e7681"/>

  <g>
    <text x="400" y="90" class="green">Role</text>
    <text x="580" y="90" class="white">Full Stack Developer</text>

    <text x="400" y="125" class="green">Languages</text>
    <text x="580" y="125" class="white">JavaScript, TypeScript</text>

    <text x="400" y="160" class="green">Technologies</text>
    <text x="580" y="160" class="white">React, Node.js</text>

    <text x="400" y="195" class="green">Focus</text>
    <text x="580" y="195" class="white">Building useful software</text>
  </g>

  <text x="400" y="250" class="white">
    Contact
  </text>
  <path d="M 480 245 H 960"
        stroke="#6e7681"/>

  <text x="400" y="290" class="green">
    GitHub
  </text>
  <text x="580" y="290" class="white">
    VaibhavGuela
  </text>

  <text x="400" y="365" class="green">
    &gt;
  </text>
  <rect x="425" y="351"
        width="10" height="18"
        fill="#7ee787"
        class="cursor"/>
</svg>
